 <!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulário de Cadastro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrapper">
    <section class="card">
      <header class="card__header">
        <h1>Cadastro</h1>
        <p>Preencha seus dados abaixo</p>
      </header>

      <form id="cadastro-form" novalidate>
        <div class="field">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required />
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required />
        </div>

        <div class="field">
          <label for="nascimento">Data de nascimento</label>
          <input type="date" id="nascimento" name="nascimento" required />
        </div>

        <div class="field">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required />
        </div>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-top: 40px;
    background: #f5f5f5;
  }
  #valor {
    font-size: 24px;
    font-weight: bold;
  }
  input[type="range"] {
    width: 300px;
  }
  canvas {
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
</style>
</head>
<body>
 
  <h2>Nivel de satisfação: <span id="valor">50</span></h2>
 
  <input type="range" id="slider" min="0" max="100" value="50" step="1">
 
  <canvas id="canvas" width="320" height="60"></canvas>
 
  <script>
    const slider = document.getElementById('slider');
    const valorSpan = document.getElementById('valor');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
 
    function desenhar(valor) {
      const largura = canvas.width;
      const altura = canvas.height;
 
      // limpa o canvas
      ctx.clearRect(0, 0, largura, altura);
 
      // fundo da barra
      ctx.fillStyle = '#e0e0e0';
      ctx.fillRect(10, altura / 2 - 10, largura - 20, 20);
 
      // barra preenchida proporcional ao valor (0-100)
      const larguraPreenchida = ((largura - 20) * valor) / 100;
      ctx.fillStyle = '#4a90e2';
      ctx.fillRect(10, altura / 2 - 10, larguraPreenchida, 20);
 
      // borda
      ctx.strokeStyle = '#999';
      ctx.strokeRect(10, altura / 2 - 10, largura - 20, 20);
    }
 
    function atualizar() {
      const valor = Number(slider.value);
      valorSpan.textContent = valor;
      desenhar(valor);
    }
 
    slider.addEventListener('input', atualizar);
 
    // desenho inicial
    atualizar();
  </script>
        <button type="submit" class="btn">Enviar</button>
      </form>

      <section id="resultado" class="resultado" hidden>
        <h2>Resultado enviado</h2>
        <p class="resultado__resumo" id="resumo-texto"></p>
        <canvas id="grafico" width="320" height="180"></canvas>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

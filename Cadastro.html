<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulário de Cadastro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrapper">
    <section class="card">
      <header class="card__header">
        <h1>Cadastro</h1>
        <p>Preencha seus dados abaixo</p>
      </header>

      <form id="cadastro-form" novalidate>
        <div class="field">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required />
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required />
        </div>

        <div class="field">
          <label for="nascimento">Data de nascimento</label>
          <input type="date" id="nascimento" name="nascimento" required />
        </div>

        <div class="field">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required />
        </div>

        <div class="field field--range">
          <label for="nivel">Nível de satisfação</label>
          <div class="range-row">
            <input type="range" id="nivel" name="nivel" min="0" max="100" value="50" />
            <output id="nivel-valor" for="nivel">50</output>
          </div>
        </div>

        <button type="submit" class="btn">Enviar</button>
      </form>

      <section id="resultado" class="resultado" hidden>
        <h2>Resultado enviado</h2>
        <p class="resultado__resumo" id="resumo-texto"></p>
        <canvas id="grafico" width="320" height="180"></canvas>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
